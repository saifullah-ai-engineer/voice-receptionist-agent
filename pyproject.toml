[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-receptionist-agent"
version = "0.2.0"
description = "A voice receptionist agent for small businesses. Greets callers, understands intent, routes calls, and drafts replies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saif Ullah" }]
dependencies = ["langgraph==1.2.20"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
